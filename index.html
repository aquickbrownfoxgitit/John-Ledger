<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>John Dickerson – Fiduciary Ledger</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app">

  <h1>John Dickerson<br><small>Fiduciary Ledger</small></h1>

  <!-- BALANCES -->
  <div class="balances card">
    <div class="balance">
      <label>Savings / Allocated</label>
      <div id="savingsBalance">$0.00</div>
    </div>
    <div class="balance">
      <label>Monthly Goings-On</label>
      <div id="goingsBalance">$0.00</div>
    </div>
    <div class="balance">
      <label>Fronted (Owed to April)</label>
      <div id="frontedBalance" class="negative">$0.00</div>
    </div>
  </div>

  <!-- FORM -->
  <div class="card">
    <h2>Add / Edit Transaction</h2>

    <form id="txForm">
      <input type="hidden" id="editId" />

      <label>Date</label>
      <input type="date" id="date" required />

      <label>Amount</label>
      <input type="number" id="amount" step="0.01" required inputmode="decimal" />

      <label>From</label>
      <select id="from" required>
        <option value="">Select</option>
        <option>WF Checking (John)</option>
        <option>Savings / Allocated</option>
        <option>Monthly Goings-On</option>
        <option>April Personal (FAIRWINDS)</option>
        <option>Other / External</option>
      </select>

      <label>To</label>
      <select id="to" required>
        <option value="">Select</option>
        <option>Savings / Allocated</option>
        <option>Monthly Goings-On</option>
        <option>John Checking (External)</option>
        <option>Rent / Bills (External)</option>
        <option>Reimburse April (FAIRWINDS)</option>
        <option>Fronted (Owed to April)</option>
        <option>Other / External</option>
      </select>

      <label>Notes (optional)</label>
      <input type="text" id="notes" placeholder="Context / reminder" />

      <button type="submit">Save Transaction</button>
    </form>
  </div>

  <!-- LEDGER -->
  <div class="card">
    <h2>Ledger</h2>
    <div id="ledger"></div>
  </div>

  <button onclick="window.print()">Print / Save as PDF</button>

</div>

<script src="script.js"></script>
</body>
</html>
