<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>John Dickerson – Fiduciary Ledger</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
<div class="app">

  <h1>
    John Dickerson<br>
    <small>Fiduciary Ledger</small>
  </h1>

  <!-- NAV TABS -->
  <div class="tabs">
    <button class="tab active" id="tabDashboard">Dashboard</button>
    <button class="tab" id="tabLedger">Ledger</button>
  </div>

  <!-- =========================
       PAGE 1: DASHBOARD
  ========================== -->
  <div id="pageDashboard" class="page active">

    <!-- BALANCES -->
    <div class="card balances">

      <div class="balance">
        <label>Savings / Allocated</label>
        <div id="savingsBalance">$0.00</div>
        <input type="number" id="manualSavings" step="0.01" placeholder="Set balance">
        <button id="setSavings">Set Balance</button>
      </div>

      <div class="balance">
        <label>Monthly Goings-On</label>
        <div id="goingsBalance">$0.00</div>
        <input type="number" id="manualGoings" step="0.01" placeholder="Set balance">
        <button id="setGoings">Set Balance</button>
      </div>

      <div class="balance readonly">
        <label>Fronted (from Savings / Allocated)</label>
        <div id="frontedBalance">$0.00</div>
      </div>

    </div>

    <!-- TRANSACTION ENTRY -->
    <div class="card">
      <h2>Add / Edit Transaction</h2>

      <form id="txForm">

        <input type="hidden" id="editId">

        <label>Date</label>
        <input type="date" id="date" required>

        <label>Amount</label>
        <input
          type="number"
          id="amount"
          step="0.01"
          inputmode="decimal"
          required
        >

        <label>From</label>
        <select id="from" required>
          <option value="">Select</option>
          <option>WF Checking (John)</option>
          <option>Savings / Allocated</option>
          <option>Monthly Goings-On</option>
          <option>Fronted (from Savings / Allocated)</option>
          <option>April Personal (FAIRWINDS)</option>
          <option>Other / External</option>
        </select>

        <label>To</label>
        <select id="to" required>
          <option value="">Select</option>
          <option>Savings / Allocated</option>
          <option>Monthly Goings-On</option>
          <option>Fronted (from Savings / Allocated)</option>
          <option>John Checking (External)</option>
          <option>Rent / Bills (External)</option>
          <option>Reimburse April (FAIRWINDS)</option>
          <option>Other / External</option>
        </select>
        <label>Notes (optional)</label>
<input type="text" id="notes" placeholder="Context / explanation">

<button type="submit">Save Transaction</button>


        <label>Notes (optional)</label>
        <input type="text" id="notes" placeholder="Context / explanation">

        <button type="submit">Save Transaction</button>

      </form>
    </div>
  </div>

  <!-- =========================
       PAGE 2: LEDGER
  ========================== -->
  <div id="pageLedger" class="page">

    <div class="card">
      <h2>Ledger</h2>

      <div class="filters">
        <label>Start Date</label>
        <input type="date" id="filterStart">

        <label>End Date</label>
        <input type="date" id="filterEnd">

        <button id="exportRange">Export Range (PDF)</button>
        <button class="danger" id="deleteRange">Delete Range</button>
      </div>

      <hr>

      <div id="ledger"></div>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
